name: atelierfit-pwa-check
on:
  push:
    branches: [audit/atelierfit-pwa]
    paths: ['tools/**', '.github/workflows/**']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.56.1 jsqr@1.4.0 pngjs@7.0.0 && npx playwright install --with-deps chromium webkit
      - run: OUT=$(cat tools/out.txt) node tools/afpwa.mjs
      - name: Commit results
        if: always()
        run: |
          git config user.name "audit-bot"; git config user.email "audit-bot@users.noreply.github.com"
          git add results*
          git commit -m "AtelierFit PWA check results" || exit 0
          git pull --rebase origin audit/atelierfit-pwa || true
          git push origin HEAD:audit/atelierfit-pwa
