name: visitor-audit
on:
  push:
    branches: [audit/visitor-run]
    paths: ['tools/**', '.github/workflows/**']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: OUT=$(cat tools/out.txt) node tools/$(cat tools/mode.txt 2>/dev/null || echo sweep).mjs
      - name: Commit results
        if: always()
        run: |
          git config user.name "audit-bot"; git config user.email "audit-bot@users.noreply.github.com"
          git add results*
          git commit -m "Visitor sweep results" || exit 0
          git pull --rebase origin audit/visitor-run || true
          git push origin HEAD:audit/visitor-run
