name: visitor-audit
on:
  push:
    branches: [audit/visitor-run]
    paths: ['tools/**', '.github/workflows/**']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node tools/audit.mjs
      - name: Commit results
        if: always()
        run: |
          git config user.name "audit-bot"; git config user.email "audit-bot@users.noreply.github.com"
          git add results
          git commit -m "Visitor audit results" || exit 0
          git push origin HEAD:audit/visitor-run
