name: StitchBook Desktop

# Builds real, installable StitchBook desktop installers (.msi on Windows, .dmg on macOS,
# .AppImage/.deb on Linux) with Tauri, and attaches them to a GitHub Release. The app itself
# is a thin shell that loads the real, live StitchBook page -- see desktop/stitchbook/README.md.
#
# Verified by a real run (2026-10-07, workflow_dispatch): the actual Tauri build succeeded on
# all three platforms (icons generated, Rust compiled, app bundled) -- it only failed at the
# final "Build and release" step with "Resource not accessible by integration" because the
# workflow never granted GITHUB_TOKEN permission to create a release. Fixed with the
# `permissions: contents: write` block below.
#
# Second real run (2026-10-08, workflow_dispatch) with that fix: the build succeeded on all
# three platforms and real installers (.msi/.exe, .dmg, .AppImage/.deb/.rpm) were attached to
# a release -- but it landed as a DRAFT with an auto-generated "untagged-..." name, invisible
# on the repo's public Releases page, because releaseDraft was true and workflow_dispatch has
# no real tag to attach it to. Fixed by setting releaseDraft to false below; a real
# `stitchbook-v*` tag push now publishes immediately instead of leaving a draft to approve by
# hand (this session's own GitHub access can't edit/publish an existing release directly, so a
# fresh tagged run is the fix, not a one-off API call).

on:
  push:
    tags:
      - 'stitchbook-v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies (Tauri's own GTK/WebKit requirements)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/stitchbook/src-tauri -> target'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install desktop app dependencies
        working-directory: desktop/stitchbook
        run: npm install

      - name: Generate real platform icons from the source icon
        working-directory: desktop/stitchbook
        run: npx tauri icon app-icon.png

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/stitchbook
          tagName: stitchbook-v__VERSION__
          releaseName: 'StitchBook Desktop v__VERSION__'
          releaseBody: 'Installable StitchBook desktop build. Download the installer for your OS below.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
