name: StitchBook Desktop

# Builds real, installable StitchBook desktop installers (.msi on Windows, .dmg on macOS,
# .AppImage/.deb on Linux) with Tauri, and attaches them to a GitHub Release. The app itself
# is a thin shell that loads the real, live StitchBook page -- see desktop/stitchbook/README.md.
#
# This workflow has not been run yet (written from Tauri's documented CI pattern -- see
# https://tauri.app/distribute/pipelines/github -- without a local Rust/Cargo toolchain or npm
# registry access to verify it end-to-end in the sandbox this was authored in). The first real
# signal on whether it actually builds is its own run in the Actions tab, not anything claimed
# here. If it fails, the run's own logs are the place to start, not this comment.

on:
  push:
    tags:
      - 'stitchbook-v*'
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies (Tauri's own GTK/WebKit requirements)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/stitchbook/src-tauri -> target'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install desktop app dependencies
        working-directory: desktop/stitchbook
        run: npm install

      - name: Generate real platform icons from the source icon
        working-directory: desktop/stitchbook
        run: npx tauri icon app-icon.png

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/stitchbook
          tagName: stitchbook-v__VERSION__
          releaseName: 'StitchBook Desktop v__VERSION__'
          releaseBody: 'Installable StitchBook desktop build. Download the installer for your OS below.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
