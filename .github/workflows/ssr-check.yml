name: SSR check

# Builds the app, starts the production server and fails if / or /about come back as an empty
# client-side shell instead of server-rendered pages. The same check also runs in the Vercel build
# (see vercel.json), so a broken render blocks the deploy.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  ssr-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci requires package-lock.json to exactly match package.json's dependency list, and this
      # repo's lock file has drifted out of sync with it (confirmed: several deps in package.json --
      # @anthropic-ai/sdk, @sentry/node, puppeteer-core, qrcode and others -- aren't in the lock file's
      # root dependency entries), which is why this check has been failing on every push regardless of
      # what else changed. Vercel's own build doesn't hit this because its default install isn't as
      # strict. npm install resolves and installs from package.json directly instead of requiring that
      # exact match, so it's used here too -- the real fix (regenerating the lock file) needs an
      # environment with npm registry access, which this check's own runner has but the sandbox this
      # comment was written in did not.
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm run check:ssr
