[package]
name = "stitchbook"
version = "0.1.0"
description = "StitchBook desktop shell -- the real, live StitchBook dashboard in a native window."
authors = ["Abdulwahab Abdullahi"]
edition = "2021"

[lib]
name = "stitchbook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
